[project]
name = "municipal-asset-management"
version = "1.0.0"
description = "Municipal Asset Management System - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.2",
    "reportlab==4.4.0",
    "boto3==1.35.99",
    "python-multipart==0.0.20",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.131.9",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "ruff==0.11.12",
    "mypy==1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
