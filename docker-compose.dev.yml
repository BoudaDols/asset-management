# Municipal Asset Management System - Development Docker Compose
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose -f docker-compose.dev.yml up --build

services:
  # --- PostgreSQL 16 Database (Central DB: catalog, tenants, users) ---
  postgres:
    image: postgres:16-alpine
    container_name: mam_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend (with hot reload) ---
  api:
    build:
      context: ./backend
      target: development
    container_name: mam_api
    environment:
      CENTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      LAMBDA_IMPORT_FUNCTION: ${LAMBDA_IMPORT_FUNCTION:-sgam-import-processor}
      LAMBDA_EXPORT_FUNCTION: ${LAMBDA_EXPORT_FUNCTION:-sgam-export-processor}
      USE_LAMBDA: ${USE_LAMBDA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      PAGE_SIZE_DEFAULT: ${PAGE_SIZE_DEFAULT:-25}
      PAGE_SIZE_MAX: ${PAGE_SIZE_MAX:-500}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- React Frontend (Vite dev server) ---
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: mam_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
